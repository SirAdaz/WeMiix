# =====================================================
# WeMiix — Docker Compose
# Démarrage : docker compose up --build
# =====================================================

networks:
  wemiix-network:
    driver: bridge
    name: wemiix-network

volumes:
  postgres_data:
    name: wemiix_postgres_data
  mongodb_data:
    name: wemiix_mongodb_data
  redis_data:
    name: wemiix_redis_data

services:

  # -----------------------------------------------
  # PostgreSQL — Base de données principale
  # -----------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wemiix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wemiix_db}
      POSTGRES_USER: ${POSTGRES_USER:-wemiix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - wemiix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wemiix_user} -d ${POSTGRES_DB:-wemiix_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------------
  # Redis — Cache & sessions en temps réel
  # -----------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: wemiix-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - wemiix-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -----------------------------------------------
  # MongoDB — Stockage mini-jeux & sessions (optionnel)
  # -----------------------------------------------
  mongodb:
    image: mongo:7
    container_name: wemiix-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-wemiix_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: wemiix_games
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - wemiix-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -----------------------------------------------
  # Backend Spring Boot — API REST + WebSocket
  # -----------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: wemiix-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-wemiix_db}
      POSTGRES_USER: ${POSTGRES_USER:-wemiix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      MONGO_HOST: mongodb
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME:-wemiix_user}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-changeme_at_least_32_chars_long_secret}
    ports:
      - "8080:8080"
    networks:
      - wemiix-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # -----------------------------------------------
  # Frontend Next.js 16 — Interface utilisateur
  # Mode DEV avec hot-reload via volume mount
  # -----------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: wemiix-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
      WATCHPACK_POLLING: "true"
    volumes:
      # Hot-reload en développement : monter les sources
      - ./frontend:/app
      # Ne pas écraser node_modules du container
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - wemiix-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
