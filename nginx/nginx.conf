# =====================================================
# WeMiix — Configuration Nginx
# Reverse proxy : frontend (3000), backend (8080)
# WebSocket, sécurité, rate limiting, gzip
# =====================================================

# Nombre de workers = auto (basé sur les CPU disponibles)
worker_processes auto;

# Logs vers stdout/stderr (compatibilité Docker)
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------
    # Format de log + sortie stdout Docker
    # -----------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile        on;
    keepalive_timeout 65;

    # -----------------------------------------------
    # Gzip — compression des assets statiques
    # -----------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # -----------------------------------------------
    # Rate limiting — 10 req/s par IP sur /api/
    # Zone de 10 Mo (≈ 160 000 adresses IP)
    # -----------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # -----------------------------------------------
    # Upstream : backend Spring Boot
    # -----------------------------------------------
    upstream backend {
        server backend:8080;
        keepalive 16;
    }

    # -----------------------------------------------
    # Upstream : frontend Next.js
    # -----------------------------------------------
    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # -----------------------------------------------
    # Serveur principal — port 80
    # -----------------------------------------------
    server {
        listen 80;
        server_name _;

        # Headers de sécurité globaux
        add_header X-Frame-Options        "SAMEORIGIN"        always;
        add_header X-Content-Type-Options "nosniff"           always;
        add_header X-XSS-Protection       "1; mode=block"     always;

        # -----------------------------------------------
        # /api/ → backend Spring Boot
        # Rate limiting activé + burst de 20
        # -----------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # -----------------------------------------------
        # /ws/ → WebSocket vers le backend
        # Headers Upgrade + Connection obligatoires
        # -----------------------------------------------
        location /ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "Upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Timeout plus long pour les connexions WebSocket persistantes
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        # -----------------------------------------------
        # / → frontend Next.js (catch-all)
        # -----------------------------------------------
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Nécessaire pour le hot-reload Next.js (EventSource / SSE)
            proxy_set_header   Connection        "";
            proxy_buffering    off;
        }
    }
}
