# =====================================================
# WeMiix — Docker Compose override PRODUCTION
# Usage : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =====================================================

services:

  # -----------------------------------------------
  # Backend — build cible production, sans port exposé
  # Toute requête passe par Nginx
  # -----------------------------------------------
  backend:
    build:
      target: production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_HOST: mongodb
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      SPRING_PROFILES_ACTIVE: prod
    # Suppression du port direct 8080 — accès uniquement via Nginx
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512m

  # -----------------------------------------------
  # Frontend — build cible production, sans port exposé
  # Hot-reload désactivé, volumes de dev supprimés
  # -----------------------------------------------
  frontend:
    build:
      target: production
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NODE_ENV: production
    # Suppression du port direct 3000 — accès uniquement via Nginx
    ports: !reset []
    # Suppression des volumes de hot-reload (dev only)
    volumes: !reset []
    deploy:
      resources:
        limits:
          memory: 256m

  # -----------------------------------------------
  # Nginx — exposé sur 80 (HTTP) et 443 (HTTPS futur)
  # -----------------------------------------------
  nginx:
    ports:
      - "80:80"
      - "443:443"
    # Volumes SSL à monter quand les certificats seront disponibles
    # volumes:
    #   - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    #   - ./nginx/ssl:/etc/nginx/ssl:ro
    #   - /etc/letsencrypt:/etc/letsencrypt:ro
